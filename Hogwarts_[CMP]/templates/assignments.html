<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霍格沃茨 - 作业中心</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="main-body">
    <nav class="navbar">
        <div class="nav-brand">
            <span class="brand-icon">⚡</span>
            <span class="brand-text">霍格沃茨作业系统</span>
        </div>
        <div class="nav-links">
            <a href="/dashboard" class="nav-link">
                <span class="nav-icon">🏠</span>
                首页
            </a>
            <a href="/assignments" class="nav-link active">
                <span class="nav-icon">📝</span>
                作业中心
            </a>
            <a href="/statistics" class="nav-link">
                <span class="nav-icon">📊</span>
                成绩统计
            </a>
            <a href="/profile" class="nav-link">
                <span class="nav-icon">👤</span>
                个人信息
            </a>
            <button id="logout-btn" class="logout-btn">
                <span class="logout-icon">🚪</span>
                退出
            </button>
        </div>
    </nav>

    <div class="main-content">
        <div class="page-header">
            <h1>📝 作业中心</h1>
            <p>管理你的魔法作业</p>
        </div>

        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="pending">待提交</button>
            <button class="filter-btn" data-filter="submitted">已提交</button>
            <button class="filter-btn" data-filter="graded">已批改</button>
        </div>

        <div class="assignment-grid" id="assignment-grid">
        </div>

        <div class="modal" id="submit-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>提交作业</h3>
                    <button class="modal-close" id="modal-close">✕</button>
                </div>
                <div class="modal-body">
                    <div id="modal-assignment-info"></div>
                    <div class="form-group">
                        <label class="form-label">作业内容</label>
                        <textarea id="submit-content" class="form-textarea" placeholder="在此输入你的作业内容..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="modal-btn cancel-btn" id="cancel-submit">取消</button>
                    <button class="modal-btn submit-btn" id="confirm-submit">
                        <span>🦉</span> 发送猫头鹰
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
