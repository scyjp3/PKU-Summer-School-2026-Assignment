<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霍格沃茨 - 作业管理系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="main-body">
    <nav class="navbar">
        <div class="nav-brand">
            <span class="brand-icon">⚡</span>
            <span class="brand-text">霍格沃茨作业系统</span>
        </div>
        <div class="nav-links">
            <a href="/dashboard" class="nav-link active">
                <span class="nav-icon">🏠</span>
                首页
            </a>
            <a href="/assignments" class="nav-link">
                <span class="nav-icon">📝</span>
                作业中心
            </a>
            <a href="/statistics" class="nav-link">
                <span class="nav-icon">📊</span>
                成绩统计
            </a>
            <a href="/profile" class="nav-link">
                <span class="nav-icon">👤</span>
                个人信息
            </a>
            <button id="logout-btn" class="logout-btn">
                <span class="logout-icon">🚪</span>
                退出
            </button>
        </div>
    </nav>

    <div class="main-content">
        <div class="welcome-section">
            <div class="welcome-card">
                <div class="welcome-icon">🎓</div>
                <h1 id="welcome-title">欢迎回来，学生</h1>
                <p id="welcome-house">等待学院分配...</p>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📝</div>
                <div class="stat-content">
                    <p class="stat-value" id="stat-total">0</p>
                    <p class="stat-label">总作业数</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-content">
                    <p class="stat-value" id="stat-submitted">0</p>
                    <p class="stat-label">已提交</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⏳</div>
                <div class="stat-content">
                    <p class="stat-value" id="stat-pending">0</p>
                    <p class="stat-label">待提交</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⭐</div>
                <div class="stat-content">
                    <p class="stat-value" id="stat-avg">0</p>
                    <p class="stat-label">平均分</p>
                </div>
            </div>
        </div>

        <div class="recent-section">
            <div class="section-header">
                <h2>📋 最近作业</h2>
                <a href="/assignments" class="view-all">查看全部 →</a>
            </div>
            <div class="assignment-list" id="recent-assignments">
            </div>
        </div>

        <div class="deadline-section">
            <div class="section-header">
                <h2>⏰ 即将截止</h2>
            </div>
            <div class="deadline-list" id="deadline-assignments">
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
