<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霍格沃茨 - 成绩统计</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="main-body">
    <nav class="navbar">
        <div class="nav-brand">
            <span class="brand-icon">⚡</span>
            <span class="brand-text">霍格沃茨作业系统</span>
        </div>
        <div class="nav-links">
            <a href="/dashboard" class="nav-link">
                <span class="nav-icon">🏠</span>
                首页
            </a>
            <a href="/assignments" class="nav-link">
                <span class="nav-icon">📝</span>
                作业中心
            </a>
            <a href="/statistics" class="nav-link active">
                <span class="nav-icon">📊</span>
                成绩统计
            </a>
            <a href="/profile" class="nav-link">
                <span class="nav-icon">👤</span>
                个人信息
            </a>
            <button id="logout-btn" class="logout-btn">
                <span class="logout-icon">🚪</span>
                退出
            </button>
        </div>
    </nav>

    <div class="main-content">
        <div class="page-header">
            <h1>📊 成绩统计</h1>
            <p>查看你的魔法学业表现</p>
        </div>

        <div class="stats-overview">
            <div class="overview-card primary">
                <div class="overview-icon">🏆</div>
                <div class="overview-content">
                    <p class="overview-value" id="stat-overall">0</p>
                    <p class="overview-label">综合评分</p>
                </div>
            </div>
            <div class="overview-card">
                <div class="overview-icon">✅</div>
                <div class="overview-content">
                    <p class="overview-value" id="stat-completed">0</p>
                    <p class="overview-label">完成率</p>
                </div>
            </div>
            <div class="overview-card">
                <div class="overview-icon">⭐</div>
                <div class="overview-content">
                    <p class="overview-value" id="stat-excellent">0</p>
                    <p class="overview-label">优秀次数</p>
                </div>
            </div>
        </div>

        <div class="chart-section">
            <div class="section-header">
                <h2>📈 成绩分布</h2>
            </div>
            <div class="chart-container">
                <canvas id="score-chart"></canvas>
            </div>
        </div>

        <div class="chart-section">
            <div class="section-header">
                <h2>📊 各科成绩对比</h2>
            </div>
            <div class="chart-container">
                <canvas id="course-chart"></canvas>
            </div>
        </div>

        <div class="progress-section">
            <div class="section-header">
                <h2>🎯 作业进度</h2>
            </div>
            <div class="progress-list" id="progress-list">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
